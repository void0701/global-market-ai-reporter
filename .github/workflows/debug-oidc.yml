# OIDC の信頼ポリシーが合わない原因を切り分けるための一時ワークフロー。
#
# 「Not authorized to perform sts:AssumeRoleWithWebIdentity」は
#   (a) 信頼ポリシーの条件（sub / aud）が合っていない
#   (b) SCP などで STS の操作自体が拒否されている
# の両方で同じ文面になるため、クライアント側からは区別できない。
#
# **GitHub が実際に送っているクレームを見れば (a) か (b) かが決まる。**
#
# ⚠️ ID トークンそのものは資格情報なので絶対に出力しない。
#    必要なクレーム（sub / aud / repository / ref）だけを抜き出す。
#
# 原因が判明したら **このファイルは削除する**。
name: debug OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    name: OIDC トークンのクレームを確認
    runs-on: ubuntu-latest
    steps:
      - name: ID トークンを取得
        run: |
          set -euo pipefail
          curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            -o /tmp/oidc.json
          # 取得できたかだけ確認する（値は出さない）
          python3 -c "
          import json
          d = json.load(open('/tmp/oidc.json'))
          assert d.get('value'), f'トークンが空です: {list(d)}'
          print('トークン取得 OK（長さ', len(d['value']), '文字）')
          "

      - name: クレームを表示（トークン本体は出さない）
        run: |
          set -euo pipefail
          # ヒアドキュメントは python3 のスクリプト供給に使うため、
          # トークンはファイル経由で渡す（stdin は使えない）
          python3 <<'PY'
          import base64
          import json

          token = json.load(open("/tmp/oidc.json"))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          # 見たい項目だけ。トークン全体や署名は出さない
          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "ref_type",
              "workflow",
              "event_name",
              "environment",
              "job_workflow_ref",
          ):
              if key in claims:
                  print(f"{key:<18} = {claims[key]}")

          print()
          print("--- 信頼ポリシーに書くべき値 ---")
          print(f'aud = "{claims.get("aud")}"')
          print(f'sub = "{claims.get("sub")}"')
          PY

      - name: 参考 — ロールの引き受けを試す
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::768756481546:role/s-and-p-gha-plan
          aws-region: ap-southeast-2
          retry-max-attempts: 1
