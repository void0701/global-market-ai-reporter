# PR と main への push で走る検査（docs/06 §4-4, §4-6）。
#
# サードパーティ Action は**コミット SHA で固定**する（A-69）。タグは後から
# 書き換えられるため、タグ指定ではサプライチェーン攻撃を防げない。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 既定を読み取りだけにする。必要な権限は各ジョブで足す
permissions:
  contents: read

concurrency:
  # 同じブランチへの連続 push では古い実行を打ち切る
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint / 型 / テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Lambda ランタイムと揃える（A-138）
          python-version: "3.12"
          cache: pip

      - name: 依存のインストール
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src tests

      - name: ruff format
        run: ruff format --check src tests

      - name: mypy
        # src だけでなく tests も検査する。ドライラン用フィクスチャが
        # スキーマからずれるのを型で止めるため（docs/13 §8 R-4）
        run: mypy src tests

      - name: pytest
        # LLM は呼ばない（ドライラン + スタブ）ので課金は発生しない
        run: pytest -q

      - name: pytest（JST）
        # ランナーは UTC、開発機は JST。**タイムゾーン依存のバグは
        # 片方でしか出ない**（実際に generated_at の比較で踏んだ）
        env:
          TZ: Asia/Tokyo
        run: pytest -q

      - name: Lambda zip のビルド
        # 50MB 超過と、設定 TOML の同梱漏れ（R-1）をここで検出する
        run: ./scripts/build_lambda.sh

      - name: zip を成果物として保存
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-zip
          path: build/lambda.zip
          retention-days: 7

  security:
    name: シークレット / 脆弱性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks は履歴全体を走査する。浅いクローンでは過去の漏洩を見逃す
          fetch-depth: 0

      # 公式 Action ではなくバイナリを直接使う。
      #
      # Action は push イベントの差分範囲（before..after）を git log に渡すが、
      # **最初のコミットが範囲に入ると `<root>^` が存在せず git log が失敗し、
      # 0 バイトしかスキャンしないまま終わる**（実際に踏んだ）。
      # 「スキャンしたことになっているが実際には何も見ていない」のが最悪なので、
      # 範囲計算に依存しない全履歴スキャンに変えた。
      - name: gitleaks を取得（SHA256 を検証する）
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: gitleaks（全履歴を走査）
        run: |
          set -euo pipefail
          # --log-opts=--all で全ブランチ・全コミットを対象にする。
          # 「0 バイトだった」を見逃さないよう、走査後に出力を確認する
          /tmp/gitleaks git . \
            --log-opts=--all \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --verbose 2>&1 | tee /tmp/gitleaks.log

          if grep -qE 'scanned ~0 bytes|failed to scan' /tmp/gitleaks.log; then
            echo "::error::gitleaks が実質何もスキャンしていません"
            exit 1
          fi

      - name: 検出結果を保存
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: pip-audit（Lambda に載る依存の既知脆弱性）
        # 環境ではなく requirements-lambda.txt を監査する。本番に実際に
        # 載るものだけを見たいため。環境を監査すると editable install の
        # market-report が PyPI に無く --strict が必ず失敗する
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict --desc -r requirements-lambda.txt

      - name: pip-audit（開発依存。失敗させない）
        continue-on-error: true
        run: |
          pip install -e ".[dev]"
          pip-audit --desc --skip-editable

  iac:
    name: Terraform / checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # plan のために AWS を読む
    env:
      AWS_REGION: ap-southeast-2
      # 読み取り専用ロール。state も読むだけで書けない
      ROLE_ARN: arn:aws:iam::768756481546:role/s-and-p-gha-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: terraform fmt
        run: terraform fmt -check -recursive infra

      - name: IAM の description の文字種
        # IAM だけ description が ASCII + Latin-1 に限られ、日本語を入れると
        # CreateRole が 400 を返す。**サーバー側の検証なので plan では
        # 検出できない**（実際に apply で踏んだ / R-13）
        run: python3 scripts/check_iam_descriptions.py infra

      - name: terraform validate（全ディレクトリ）
        run: |
          for d in infra/bootstrap infra/modules/* infra/envs/*; do
            [ -f "$d/main.tf" ] || continue
            echo "--- $d ---"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done

      - name: checkov（IaC の設定ミス検出 / A-66）
        # 除外する指摘とその理由は .checkov.yaml に 1 件ずつ書いてある。
        # ワークフローに並べると理由が失われるため設定ファイルに寄せた
        uses: bridgecrewio/checkov-action@b782b35c8411ff565b881fba67ceebdb426d7dc4 # v12.3147.0
        with:
          config_file: .checkov.yaml
          output_format: cli
          soft_fail: false

  terraform-plan:
    name: terraform plan (dev)
    runs-on: ubuntu-latest
    # フォークからの PR には OIDC トークンが発行されないためスキップする。
    # `pull_request_target` は使わない（フォークの変更を権限付きで実行して
    # しまい危険 / docs/06 §4-4）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      ROLE_ARN: arn:aws:iam::768756481546:role/s-and-p-gha-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Lambda zip のビルド
        # envs/dev が filebase64sha256 で zip を参照するため plan 前に必要
        run: ./scripts/build_lambda.sh

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - name: terraform plan
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false
          # gha-plan は state に書けないのでロックを取らない
          terraform plan -input=false -lock=false
