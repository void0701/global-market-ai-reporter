# 設定の優先順: CLIオプション > 環境変数 > このファイル

[bedrock]
# provider: "anthropic"（Claude API 直接）または "bedrock"（Amazon Bedrock）
# 環境変数 MARKET_REPORT_PROVIDER / CLI の --provider で上書き可
provider = "anthropic"
# 環境変数 BEDROCK_MODEL_ID で上書き可（Phase 2 で Terraform が Lambda 環境変数として注入）
# provider="anthropic" なら "claude-opus-5"、"bedrock" なら "anthropic.claude-opus-5"
model_id = "claude-opus-5"
region = "ap-southeast-2"            # 新サインアップ体験ではプロジェクトのリージョンを変更できないため ap-southeast-2。環境変数 AWS_REGION で上書き可
# ストリーミングを使うため非ストリーミングの上限（約21,333）に縛られない。
# 日本語レポート + 思考トークンで 15K 前後になりうるため余裕を持たせる
max_tokens = 32000
thinking_display = "summarized"      # 課金は display 設定によらず同一。推論要約を保存する

[collection]
window_hours = 24
max_articles_to_analyze = 15
max_per_feed = 4                     # 1媒体からの選抜上限。多様性の担保（下記）
summary_truncate_chars = 200         # 全フィード一律（Guardian 対策）
stale_feed_warn_hours = 48           # これより古いフィードは警告（WSJ型の故障検知）
fetch_timeout_sec = 20
# max_per_feed の根拠: FT の rss/home は総合フィードでコラム・社説を多く含み、
# 上限なしでは選抜15件の過半を占めてS&P500と無関係な記事が混入した（実測）。

max_workers = 8

[dedupe]
similarity_threshold = 0.75

[output]
max_news_analysis = 5
x_post_max_fullwidth_chars = 140
dir = "./output"                     # 環境変数 MARKET_REPORT_OUTPUT_DIR で上書き可

[market]
# AI に渡す系列（15）。保存は下の all_symbols 全件（docs/11-data-retention.md）
ai_symbols = [
  "^GSPC", "^IXIC", "^DJI",
  "ACWI", "2559.T", "USDJPY=X",
  "^VIX", "^TNX", "^TYX",
  "EWJ", "VGK", "EEM",
  "CL=F", "GC=F", "DX-Y.NYB",
]

[market.symbols]
